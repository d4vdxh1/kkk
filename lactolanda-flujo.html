/* THREE.JS — fondo ambiental: flujo de partículas (leche / producto)      */
/* ---------------------------------------------------------------------- */
function initFlowBackground() {
  const canvas = document.getElementById('bg-canvas');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 18);

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // Textura de gota suave generada por canvas (sin assets externos)
  function makeDropTexture() {
    const size = 64;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(241,231,206,0.95)');
    g.addColorStop(0.4, 'rgba(241,231,206,0.55)');
    g.addColorStop(1, 'rgba(241,231,206,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  const texture = makeDropTexture();

  const COUNT = reduced ? 0 : 260;
  const positions = new Float32Array(COUNT * 3);
  const speeds = new Float32Array(COUNT);
  const spanX = 26, spanY = 16, spanZ = 14;
  for (let i = 0; i < COUNT; i++) {
    positions[i*3+0] = (Math.random() - 0.5) * spanX;
    positions[i*3+1] = (Math.random() - 0.5) * spanY * 2;
    positions[i*3+2] = (Math.random() - 0.5) * spanZ;
    speeds[i] = 0.01 + Math.random() * 0.025;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    size: 0.34,
    map: texture,
    transparent: true,
    depthWrite: false,
    color: new THREE.Color('#F1E7CE'),
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
  });
  const points = new THREE.Points(geometry, material);
  scene.add(points);

  // líneas finas verticales sugiriendo "carriles" de flujo
  const laneColors = ['#C2760B', '#2DD4BF', '#6C7BF5'];
  const lanes = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const mat = new THREE.LineBasicMaterial({ color: laneColors[i], transparent: true, opacity: 0.10 });
    const pts = [ new THREE.Vector3(-9 + i*9, -12, -6), new THREE.Vector3(-9 + i*9, 12, -6) ];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    lanes.add(new THREE.Line(geo, mat));
  }
  scene.add(lanes);

  let raf;
  function tick() {
    const pos = geometry.attributes.position;
    for (let i = 0; i < COUNT; i++) {
      let y = pos.getY(i) - speeds[i];
      if (y < -spanY) y = spanY;
      pos.setY(i, y);
    }
    pos.needsUpdate = true;
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  if (!reduced) tick(); else renderer.render(scene, camera);

  return () => {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    geometry.dispose(); material.dispose(); texture.dispose(); renderer.dispose();
  };
}

function NodeCard({ node, product, isActive, isDimmed, onClick, cardRef, index }) {
  const lane = LANES[node.lane];
  const info = product.data[node.field];
  return (
    <div ref={cardRef} className="relative pl-14 sm:pl-16" data-node-card>
      <span
        className="marker-dot absolute left-[19px] sm:left-[23px] top-6 h-3 w-3 -translate-x-1/2 rounded-full border-2"
        style={{
          borderColor: lane.color,
          backgroundColor: isActive ? lane.color : '#101A2E',
          boxShadow: isActive ? `0 0 0 5px ${lane.color}33` : 'none',
        }}
      />
      <button
        onClick={() => onClick(node.id)}
        className={`node-card group w-full rounded-xl border bg-panel/80 p-4 text-left backdrop-blur-sm sm:p-5
          ${isActive ? 'border-current' : 'border-hairline hover:border-muted/50'} ${isDimmed ? 'dim' : ''}`}
        style={{ color: isActive ? lane.color : undefined }}
      >
        <div className="flex items-start justify-between gap-3">
          <div className="flex items-center gap-3">
            <span
              className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg"
              style={{ backgroundColor: `${lane.color}1F`, color: lane.color }}
            >

            </span>
            <div>
              <p className="font-display text-[15px] font-semibold text-bright sm:text-base">{node.title}</p>

        {node.link && (
          <p className="mt-3 text-[13px] leading-snug text-muted">{node.link}</p>
        )}

}

  }
  const lane = LANES[node.lane];

  return (
    <div className="rounded-xl border p-5" style={{ borderColor: `${lane.color}55`, backgroundColor: `${lane.color}0D` }}>

        {info.code}

function App() {
  const [productId, setProductId] = useState('yogurt');
  const [mode, setMode] = useState('directo');
  const [activeId, setActiveId] = useState(null);
  const [playing, setPlaying] = useState(false);

  const product = PRODUCTS.find(p => p.id === productId);
  const nodes = mode === 'directo' ? FORWARD_NODES : REVERSE_NODES;

  const listRef = useRef(null);
  const cardRefs = useRef({});
  const dotRef = useRef(null);
  const tlRef = useRef(null);

  // Fondo three.js — se inicializa una sola vez
  useEffect(() => {
    const cleanup = initFlowBackground();
    return cleanup;
  }, []);

  // Reinicia selección y detiene animación al cambiar de producto o modo
  useEffect(() => {
    if (tlRef.current) tlRef.current.kill();
    setPlaying(false);
    setActiveId(null);
  }, [productId, mode]);

  // Entrada animada de las tarjetas (un único momento orquestado)
  useLayoutEffect(() => {
    const cards = listRef.current ? listRef.current.querySelectorAll('[data-node-card]') : [];
    gsap.fromTo(
      cards,
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out', stagger: 0.06, delay: 0.05 }
    );
  }, [mode, productId]);

  const handleNodeClick = useCallback((id) => {
    setActiveId(prev => (prev === id ? null : id));
  }, []);

  const playFlow = useCallback(() => {
    if (tlRef.current) tlRef.current.kill();
    const order = nodes.map(n => n.id);
    const container = listRef.current;
    if (!container) return;

    const containerTop = container.getBoundingClientRect().top;
    const centers = order.map(id => {
      const el = cardRefs.current[id];
      const r = el.getBoundingClientRect();
      return r.top - containerTop + r.height / 2;
    });

    if (dotRef.current) {
      gsap.set(dotRef.current, { opacity: 1, top: centers[0] });
    }

    setPlaying(true);
    const tl = gsap.timeline({
      onComplete: () => setPlaying(false),
    });
    order.forEach((id, i) => {
      tl.call(() => setActiveId(id));
      if (dotRef.current && i > 0) {
        tl.to(dotRef.current, { top: centers[i], duration: 0.55, ease: 'power2.inOut' }, '<');
      }
      tl.to({}, { duration: 0.55 });
    });
    tl.call(() => { if (dotRef.current) gsap.to(dotRef.current, { opacity: 0, duration: 0.4 }); });
    tlRef.current = tl;
  }, [nodes]);

  const activeNode = nodes.find(n => n.id === activeId) || null;
  const showReverseEmptyState = mode === 'inversa' && !product.hasReturn;

  return (
    <div className="min-h-screen">
      <header className="border-b border-hairline/70 bg-ink/60 backdrop-blur-sm">
        <div className="mx-auto max-w-6xl px-5 py-6 sm:px-8">
          <div className="flex flex-wrap items-start justify-between gap-4">
            <div>
              <p className="text-xs uppercase tracking-wide text-entrada">Sistema de Trazabilidad · Lactolanda</p>
              <h1 className="font-display mt-1 text-2xl font-semibold text-bright sm:text-3xl">
                Del tambo al consumidor
              </h1>
              <p className="mt-1 max-w-md text-sm text-muted">
                Recorrido de la cadena de valor: aprovisionamiento, producción, distribución y devoluciones.
              </p>
            </div>
            <div className="flex flex-col items-end gap-2">
              <label className="text-[11px] uppercase tracking-wide text-muted">Producto de ejemplo</label>
              <select
                value={productId}
                onChange={e => setProductId(e.target.value)}
                className="code-chip rounded-lg border border-hairline bg-panel px-3 py-2 text-sm text-bright outline-none focus:border-entrada"
              >
                {PRODUCTS.map(p => (
                  <option key={p.id} value={p.id}>{p.code} — {p.name}</option>
                ))}
              </select>
            </div>
          </div>

          <div className="mt-5 flex flex-wrap items-center gap-3">
            {Object.keys(LANES).map(id => (
              <span key={id} className="flex items-center gap-1.5 text-[11px] text-muted">
                <span className="h-1.5 w-1.5 rounded-full" style={{ backgroundColor: LANES[id].color }} />
                {LANES[id].label}
              </span>
            ))}
          </div>

          <div className="mt-4 flex flex-wrap items-center gap-3">
            <div className="flex rounded-lg border border-hairline p-1">
              <button
                onClick={() => setMode('directo')}
                className={`rounded-md px-3 py-1.5 text-xs font-medium transition-colors ${mode === 'directo' ? 'bg-bright text-ink' : 'text-muted hover:text-bright'}`}
              >
                Recorrido directo
              </button>
              <button
                onClick={() => setMode('inversa')}
                className={`rounded-md px-3 py-1.5 text-xs font-medium transition-colors ${mode === 'inversa' ? 'text-ink' : 'text-muted hover:text-bright'}`}
                style={mode === 'inversa' ? { backgroundColor: LANES.inversa.color } : {}}
              >
                Logística inversa
              </button>
            </div>

            <button
              onClick={playFlow}
              disabled={playing || showReverseEmptyState}
              className="flex items-center gap-2 rounded-lg border border-entrada/60 bg-entrada/10 px-3 py-1.5 text-xs font-medium text-entrada transition-colors hover:bg-entrada/20 disabled:cursor-not-allowed disabled:opacity-40"
            >
              {playing ? 'Reproduciendo…' : '▶ Reproducir flujo'}
            </button>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-6xl px-5 py-10 sm:px-8">
        <div className="grid grid-cols-1 gap-8 lg:grid-cols-[1fr_340px]">
          <div>
            {showReverseEmptyState ? (
              <div className="rounded-xl border border-dashed border-inversa/40 bg-inversa/5 p-8 text-center">
                <p className="text-sm text-bright">
                  {product.name} no registra devoluciones en este ejemplo.
                </p>
                <p className="mt-1 text-xs text-muted">
                  Elegí <span className="text-bright">Yogurt Natural</span> o <span className="text-bright">Queso Paraguay</span> para ver un caso de logística inversa.
                </p>
              </div>
            ) : (
              <div ref={listRef} className="relative">
                <div className="rail-line absolute left-[25px] top-3 bottom-3 w-px sm:left-[29px]" />
                <div ref={dotRef} className="absolute left-[25px] sm:left-[29px] -translate-x-1/2 h-3.5 w-3.5 rounded-full opacity-0"
                     style={{
                       backgroundColor: LANES[mode === 'directo' ? 'salida' : 'inversa'].color,
                       boxShadow: `0 0 12px 3px ${LANES[mode === 'directo' ? 'salida' : 'inversa'].color}99`,
                     }} />
                <div className="flex flex-col gap-4">
                  {nodes.map((node, i) => {
                    const prevLane = i > 0 ? nodes[i - 1].lane : null;
                    return (
                      <React.Fragment key={node.id}>
                        {node.lane !== prevLane && (
                          <div className="pl-14 sm:pl-16">
                            <p className="text-[11px] font-medium uppercase tracking-wide" style={{ color: LANES[node.lane].color }}>
                              {LANES[node.lane].label}
                            </p>
                            <p className="text-[12px] text-muted">{LANES[node.lane].sub}</p>
                          </div>
                        )}
                        <NodeCard
                          node={node}
                          product={product}
                          isActive={activeId === node.id}
                          isDimmed={activeId !== null && activeId !== node.id}
                          onClick={handleNodeClick}
                          cardRef={el => { cardRefs.current[node.id] = el; }}
                          index={i}
                        />
                      </React.Fragment>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="mt-10 rounded-xl border border-hairline/70 bg-panel/60 p-5">
              <p className="font-display text-sm font-semibold text-bright">Trazabilidad completa</p>
              <p className="mt-1 text-xs text-muted">Consulta de extremo a extremo, en ambos sentidos.</p>
              <div className="mt-4 grid gap-4 sm:grid-cols-2">
                <div>
                  <p className="text-[11px] uppercase tracking-wide text-entrada">Hacia adelante</p>
                  <p className="code-chip mt-1 text-[12px] leading-relaxed text-muted">
                    Tambero → Acopiador → Lote de leche → Producción → Lote de producto → Depósito → Centro de Distribución → Distribuidor → Punto de Venta → Consumidor
                  </p>
                </div>
                <div>
                  <p className="text-[11px] uppercase tracking-wide" style={{ color: LANES.inversa.color }}>Hacia atrás</p>
                  <p className="code-chip mt-1 text-[12px] leading-relaxed text-muted">
                    Consumidor → Punto de Venta → Distribuidor → Centro de Distribución → Lote de producto → Orden de Producción → Lote de materia prima → Acopiador → Tambero
                  </p>
                </div>
              </div>
            </div>
          </div>

          <aside className="lg:sticky lg:top-8 lg:self-start">
            <DetailPanel node={activeNode} product={product} />
          </aside>
        </div>
      </main>

      <footer className="border-t border-hairline/70 py-6 text-center text-xs text-muted">
        Organización 2 · Caso Lactolanda — prototipo de trazabilidad e inventario para la cadena de valor.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

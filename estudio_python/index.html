ackground:var(--green);color:white}.primary:hover{background:#103e35}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px}.codebox{position:relative}pre{background:#172e2b;color:#edf5ef;overflow:auto;padding:22px;border-radius:8px;font:14px/1.7 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre}code{font-family:ui-monospace,Consolas,monospace}p code,li code{background:#eaf0eb;padding:1px 4px;border-radius:3px}label{display:block;margin:10px 0 6px}textarea{width:100%;min-height:110px;resize:vertical}input[type=number]{max-width:120px}input[type=checkbox]{width:18px;height:18px}summary{cursor:pointer;font-weight:650;padding:8px 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px}th{background:var(--soft)}.scroll{overflow-x:auto}.feedback{padding:12px;background:var(--soft);margin-top:12px;border-radius:6px}.error{background:#fff0e6;color:#77330c}.tile{display:inline-flex;flex-direction:column;align-items:center;border:1px solid #849d91;padding:10px 16px;margin:4px;border-radius:7px}.tile b{font-size:22px}.active{background:#d7ebc4;border:2px solid #43642a}.mobile{display:none}.bar{height:22px;background:#35766b;min-width:2px}.chartrow{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;gap:10px;margin:14px 0}.sim svg{max-width:100%;height:auto;background:#f7faf7;border:1px solid var(--line)}#scene canvas{max-width:100%;height:auto}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:20px}.check{border-top:1px solid var(--line);padding:18px 0}.status{font-size:13px}ol li{margin:9px 0}progress{width:100%;accent-color:var(--green)}[hidden]{display:none!important}@media(max-width:800px){header{padding:18px 20px}.shell{display:block}aside{display:none}.mobile{display:block;padding:15px 20px;background:#e6eee8}.mobile select{width:100%}main{padding:25px 18px}.card{padding:18px}header .pill{display:none}h1{ </style></head><body><a class="skip" href="#main">Saltar al contenido</a><header><div><div class="brand">Python, paso a paso<span aria-hidden="true">.</span></div><p>Tu cuaderno de aprendizaje · De la primera variable a los datos</p></div><span class="pill">20 sesiones · A tu ritmo</span></header><div class="mobile"><label for="mobileNav">Ir a una sección</label><select id="mobileNav"></select></div><div class="shell"><aside><nav id="nav" aria-label="Sesiones del curso"></nav></aside><main id="main" tabindex="-1"></main></div><script>
'use strict';
/* DATOS DEL CURSO. Los comentarios de cada línea son su explicación pedagógica. */
const S=[];
function lesson(title,goal,theory,code,out,exercise,hints,solution,rubric,error,sim,checks){S.push({title,goal,theory,code,out,exercise,hints,solution,rubric,error,sim,checks});}
const q=(prompt,answer,why)=>({prompt,answer,why});
lesson('Qué es Data Science','Distinguir una pregunta, los datos necesarios y una conclusión.',
'Data Science significa ciencia de datos: usar registros para responder preguntas. Una fila es una observación, como un ticket. Una columna describe una característica. Minutos es una variable numérica; categoría es categórica porque nombra un grupo. El promedio reparte la suma en partes iguales. La mediana es el valor central al ordenar. Un faltante indica que no sabemos un valor: no equivale a cero. Primero preguntamos, recopilamos, limpiamos, analizamos y comunicamos. Que dos cosas cambien juntas es una asociación; no demuestra que una cause la otra. En este primer ejemplo, print muestra un resultado, + suma y / divide. Los paréntesis agrupan la suma; # inicia un comentario que Python no ejecuta.',
'print((10 + 20 + 30) / 3) # Suma los tres tiempos, divide por tres y muestra el promedio.', '20.0',
'Proponé una pregunta sobre seis tickets ficticios. Nombrá una columna numérica, una categórica y una limitación.', ['Preguntá por una cantidad que puedas medir.','Podés comparar tiempos entre categorías; pensá qué pasa si falta un tiempo.'],
'¿Qué categoría tiene mayor tiempo medio? Necesito categoria y minutos. Minutos es numérica; categoria es categórica. Un tiempo faltante limita la comparación y seis tickets no representan una organización.', ['La pregunta se responde con datos.','Identifica bien ambos tipos de columna.','Explica una limitación sin afirmar causalidad.'],
'Tratar un faltante como cero baja el promedio sin evidencia. Conservá la diferencia entre no saber y medir cero.', 'pipeline', [q('Predicción: promedio de 10, 20 y 30 (solo número).','20','La suma es 60; 60 / 3 = 20.'),q('Completá: la variable «categoría» es…','categórica','Sus valores son nombres de grupos.'),q('Ordená escribiendo las letras: A analizar; B preguntar; C comunicar; D limpiar; E recopilar.','BEDAC','Una pregunta orienta la recopilación; luego limpiamos, analizamos y comunicamos.')]);
lesson('Tu primer cuaderno Jupyter','Explicar qué ocurre al ejecutar celdas fuera de orden.',
'Jupyter es un cuaderno con celdas. Una celda de código contiene instrucciones; una celda Markdown contiene texto con formato. Python es el lenguaje. El kernel es el proceso que conserva los valores mientras trabajás: pensalo como una mesa de trabajo. Reiniciarlo despeja esa mesa. Una variable es un nombre asociado a un valor; = lo asigna. Shift+Enter ejecuta la celda y avanza. Guardá el cuaderno como .ipynb. Antes de compartirlo, reiniciá el kernel y ejecutá todas las celdas en orden: los resultados guardados pueden corresponder a una ejecución vieja.',
'cantidad = 3 # Celda 1: asocia el nombre cantidad con el número 3.\nprint(cantidad + 2) # Celda 2: busca cantidad, suma 2 y muestra 5.', '5',
'Explicá qué ocurre si reiniciás el kernel y ejecutás solamente la segunda celda. Indicá cómo lo corregís.', ['Reiniciar borra las variables de la ejecución.','La segunda celda necesita que cantidad ya exista.'], 'Aparece NameError porque cantidad no está definida. Ejecuto la primera celda y luego la segunda, o reinicio y ejecuto todas en orden.', ['Nombra la variable ausente.','Relaciona el error con reiniciar.','Propone ejecutar en orden.'], 'El orden visual no garantiza el orden de ejecución. Mirá qué celdas ejecutaste, no solo dónde están.', 'notebook', [q('¿Qué muestra la segunda celda después de ejecutar la primera?','5','cantidad vale 3; se suma 2.'),q('Completá: el proceso que conserva variables se llama…','kernel','El kernel ejecuta instrucciones y mantiene el estado.'),q('Completá el error al usar cantidad tras reiniciar: …','NameError','El nombre aún no existe en el nuevo kernel.')]);
lesson('Variables y primeras instrucciones','Seguir el valor de una variable y reconocer los tipos básicos.',
'Un programa es una secuencia de instrucciones. Python es de propósito general: sirve para muchas tareas. Un intérprete ejecuta el código. Su sintaxis es la forma de escribir instrucciones; busca ser legible. La indentación, espacios al inicio, agrupa instrucciones. int representa enteros; float números con decimales; str texto entre comillas; bool los valores True y False. None representa ausencia de valor. El tipado dinámico permite asociar un nombre a valores de distintos tipos. type(3) informa el tipo int; print lo muestra. Multiplicar se escribe *. Un comentario empieza con #.',
'cantidad = 3 # Guarda la cantidad entera.\nprecio = 12000 # Guarda el precio por unidad en pesos ficticios.\nprint(cantidad * precio) # Multiplica y muestra el total en pesos.', '36000', 'Cambiá cantidad a 5 y escribí el código completo para mostrar el total.', ['El precio se mantiene en 12000.','Reemplazá el valor de cantidad, no el resultado de print.'], 'cantidad = 5\nprecio = 12000\nprint(cantidad * precio) # 60000', ['Asigna cantidad = 5.','Usa la multiplicación de variables.','Obtiene 60000.'], '"3" es texto y 3 es número. "3" + 2 produce TypeError: no mezcla texto y entero de esa forma.', 'variables', [q('¿Cuánto vale cantidad en el ejemplo original?','3','La primera asignación guarda 3.'),q('¿Qué tipo representa True?','bool','bool representa valores de verdad.'),q('¿Qué muestra el ejemplo con cantidad = 5?','60000','5 × 12000 = 60000.')]);
lesson('Cadenas y entrada de datos','Seleccionar caracteres y normalizar texto.',
'Una cadena (str) es una secuencia de caracteres. Una secuencia tiene posiciones: el primer índice es 0. len(texto) cuenta caracteres. texto[inicio:fin] obtiene un fragmento o slicing: incluye inicio y excluye fin. strip() quita espacios de los extremos; lower() pasa a minúsculas; upper() a mayúsculas. split(",") separa por comas y devuelve una lista, una colección ordenada que veremos en detalle. Una f-string, f"Hola {valor}", inserta un valor en texto. input("Nota: ") pide datos y siempre devuelve texto. int("75") convierte a entero; float("7.5") a decimal. Un método, como strip(), es una operación asociada a un objeto y se llama con punto y paréntesis.',
'texto = "  CORREO  " # Guarda texto con espacios.\nlimpio = texto.strip().lower() # Quita espacios externos y luego pasa a minúsculas.\nprint(f"Categoría: {limpio}") # Inserta el texto limpio dentro del mensaje.\nprint(limpio[0]) # Lee el primer carácter, de índice cero.\nprint(limpio[0:3]) # Lee índices 0, 1 y 2; el índice 3 queda fuera.', 'Categoría: correo\nc\ncor', 'Normalizá "  RED  " y mostrá los dos primeros caracteres.', ['Primero usá strip y lower.','El fragmento que necesitás es [0:2].'], 'texto = "  RED  "\nlimpio = texto.strip().lower()\nprint(limpio[0:2]) # re', ['Quita espacios y usa minúsculas.','Selecciona [0:2].','Muestra re.'], 'Las cadenas son inmutables: no podés hacer limpio[0] = "C". Creá una nueva cadena.', 'string', [q('¿Qué devuelve "correo"[1:4]?','orr','Incluye índices 1, 2 y 3; excluye 4.'),q('¿Qué tipo devuelve input aunque escribas 75?','str','La entrada se recibe como texto.'),q('¿Cuántos caracteres tiene "red"?','3','len cuenta r, e y d.')]);
lesson('Operadores y decisiones','Elegir la rama correcta de una condición.',
'Una condición es una expresión que resulta True o False. if ejecuta un bloque si es verdadera; elif prueba otra condición; else cubre el resto. La indentación indica qué pertenece al bloque. = asigna; == compara igualdad. También existen !=, <, >, <= y >=. and exige ambas condiciones, or al menos una y not invierte el valor de verdad. + suma, - resta, * multiplica, / divide, // divide tomando el piso, % da el resto y ** eleva a una potencia. Por ejemplo 7 // 2 da 3, 7 % 2 da 1 y 2 ** 3 da 8.',
'nota = 75 # Guarda una nota ficticia.\nif nota < 0 or nota > 100: # Detecta valores fuera del intervalo permitido.\n    print("Nota inválida") # Muestra el aviso solo para valores fuera de rango.\nelif nota >= 70: # Si es válida, comprueba si alcanza 70.\n    print("Aprobado") # Muestra esta rama para notas de 70 a 100.\nelse: # Atiende las notas válidas menores que 70.\n    print("Seguir practicando") # Muestra la rama restante.', 'Aprobado', 'Probá mentalmente 69, 70 y 101. Escribí el mensaje de cada caso y justificá el límite.', ['Primero se controla el rango.','>= incluye exactamente 70.'], '69: Seguir practicando. 70: Aprobado. 101: Nota inválida. El umbral pertenece a la rama >= 70.', ['Resuelve los tres casos.','Explica que 70 está incluido.','Controla la validez antes del umbral.'], 'Usar = para preguntar por igualdad no es correcto. Dentro de una comparación usá ==.', 'decision', [q('Mensaje para nota = 70.','Aprobado','>= incluye la igualdad.'),q('Resultado de 7 % 2.','1','Después de tres grupos de 2 sobra 1.'),q('Operador que exige dos condiciones verdaderas.','and','or necesita solo una; and necesita ambas.')]);
lesson('Bucles, acumuladores y errores','Reconstruir un total después de cada repetición.',
'Un bucle repite trabajo. for recorre elementos de una colección; [10, 20, 30] es una lista. Un acumulador conserva una suma parcial; un contador cuenta pasos. range(1, 4) produce 1, 2 y 3: el final se excluye. while repite mientras una condición sea verdadera. Hay que actualizar la variable que controla esa condición. Al leer un error, empezá por su última línea: SyntaxError indica sintaxis inválida, NameError un nombre no definido, TypeError una operación incompatible e IndexError una posición inexistente.',
'total = 0 # Inicia el acumulador sin minutos.\nfor minutos in [10, 20, 30]: # Toma cada elemento de la lista, en orden.\n    total = total + minutos # Agrega el valor actual al total anterior.\nprint(total) # Muestra el total una vez terminado el bucle.', '60', 'Escribí un while que muestre 1, 2 y 3, y termine.', ['Empezá con contador = 1.','Mientras contador <= 3, mostralo y sumale 1.'], 'contador = 1\nwhile contador <= 3:\n    print(contador)\n    contador = contador + 1', ['Inicializa en 1 y usa <= 3.','Muestra los tres valores.','Actualiza para terminar.'], 'Si no actualizás contador, while puede repetirse para siempre. Revisá condición y actualización juntas.', 'loop', [q('Total después de sumar 10 y 20.','30','El acumulador pasa de 0 a 10 y luego a 30.'),q('Último valor de range(1, 4).','3','El límite 4 no se incluye.'),q('Error al acceder a una posición que no existe.','IndexError','El nombre existe, pero la posición queda fuera de la secuencia.')]);
lesson('Listas, tuplas y secuencias','Modificar una lista y distinguirla de una tupla.',
'Una lista es una secuencia modificable: admite agregar con append y quitar el último elemento con pop(). Una tupla mantiene posiciones pero no permite reemplazar sus elementos. in consulta pertenencia; len cuenta elementos y sum suma números. sort() ordena una lista en el lugar y devuelve None; sorted(lista) crea otra lista ordenada. a, b = (2, 5) desempaqueta: asigna 2 a a y 5 a b. Una lista plana contiene valores simples; lista.copy() crea una copia independiente de esa lista plana.',
'tiempos = [10, 20, 30] # Crea una lista ordenada de minutos.\ntiempos.append(40) # Agrega 40 al final.\nprint(tiempos[1]) # Muestra el elemento de índice 1, el segundo.\ncoordenada = (2, 5) # Guarda un par de posiciones en una tupla.\nprint(sum(tiempos)) # Suma los cuatro tiempos.', '20\n100', 'Agregá 50 a [10, 20, 30], quitá el último valor y mostrá la suma. Creá además una copia independiente.', ['append agrega y pop quita al final.','La suma final vuelve a ser la de los tres valores originales.'], 'tiempos = [10, 20, 30]\ntiempos.append(50)\ntiempos.pop()\notra = tiempos.copy()\nprint(sum(tiempos)) # 60', ['Usa append y pop en orden.','Copia con .copy().','Obtiene 60.'], 'otra = tiempos asocia dos nombres a la misma lista. Cambiarla mediante un nombre afecta lo que ve el otro.', 'list', [q('Valor de [10, 20, 30][0].','10','El primer índice es 0.'),q('¿Qué método devuelve None al ordenar en el lugar?','sort','sorted produce una lista nueva; sort modifica la original.'),q('Suma de [10, 20, 30][1:3].','50','Selecciona 20 y 30.')]);
lesson('Sets y diccionarios','Elegir una estructura según el dato que querés guardar.',
'Un set es un conjunto de valores únicos, sin orden garantizado. set() crea uno vacío; {} crea un diccionario vacío. a | b une conjuntos y a & b conserva elementos comunes. Un diccionario relaciona claves con valores, como etiquetas en cajones. d["estado"] busca una clave; d.get("estado", "Sin dato") permite un valor alternativo si falta. d["estado"] = "Cerrado" actualiza esa entrada. d.items() permite recorrer pares de clave y valor.',
'categorias = {"correo", "red", "correo"} # El conjunto elimina el duplicado correo.\nprint(len(categorias)) # Cuenta dos valores únicos, sin depender del orden.\nticket = {"id": 1, "estado": "Pendiente"} # Relaciona dos claves con sus valores.\nprint(ticket["estado"]) # Consulta el valor de la clave estado.', '2\nPendiente', 'Quitá duplicados de ["red", "red", "correo"] y cambiá un ticket pendiente a cerrado.', ['Usá set para categorías únicas.','Asigná un nuevo valor a la clave estado.'], 'categorias = set(["red", "red", "correo"])\nticket = {"estado": "Pendiente"}\nticket["estado"] = "Cerrado"\nprint(len(categorias)) # 2\nprint(ticket["estado"]) # Cerrado', ['Elimina duplicados con set.','Actualiza por clave.','No depende del orden del set.'], 'Un set no admite categorías[0]. Si necesitás posiciones, elegí una secuencia.', 'collections', [q('¿Qué estructura crea {}?','diccionario','Para un set vacío se usa set().'),q('Cantidad de valores únicos de {1, 1, 2}.','2','El valor 1 se conserva una sola vez.'),q('Símbolo de intersección de sets.','&','& conserva elementos comunes; | une los elementos.')]);
lesson('Funciones: mostrar y devolver','Crear una función cuyo resultado pueda reutilizarse.',
'Una función reúne instrucciones reutilizables. def la define y una llamada la ejecuta. Un parámetro es el nombre que recibe un dato; un argumento es el valor enviado. return devuelve un valor al lugar de la llamada y termina la función. print solo muestra texto; su valor devuelto es None. Una variable local existe dentro de la función: pensala como una nota de trabajo interna.',
'def convertir_a_horas(minutos): # Define la función con el parámetro minutos.\n    return minutos / 60 # Devuelve la conversión, sin imprimirla.\nhoras = convertir_a_horas(90) # Llama con el argumento 90 y guarda el valor devuelto.\nprint(horas) # Muestra el resultado guardado.', '1.5', 'Definí calcular_total(precio, cantidad). Comprobá con (10, 3) y (7, 2).', ['Necesita dos parámetros.','Devolvé precio * cantidad con return.'], 'def calcular_total(precio, cantidad):\n    return precio * cantidad\nprint(calcular_total(10, 3)) # 30\nprint(calcular_total(7, 2)) # 14', ['Define dos parámetros.','Devuelve, no solo imprime.','Comprueba 30 y 14.'], 'Si reemplazás return por print, la función muestra el cálculo pero quien la llama recibe None.', 'function', [q('Resultado devuelto para 120 minutos.','2.0','120 / 60 produce el decimal 2.0.'),q('Palabra que devuelve un valor.','return','print lo muestra; return lo entrega al código que llamó.'),q('En convertir_a_horas(90), ¿qué número es el argumento?','90','El parámetro se llama minutos; el argumento concreto es 90.')]);
lesson('Tres formas de transformar datos','Relacionar for, comprensión y map con el mismo resultado.',
'Transformar es obtener un nuevo valor a partir de otro. Primero un for explícito construye una lista. Una comprensión condensa ese recorrido entre corchetes. Puede filtrar: [n for n in numeros if n > 1]. Una lambda define una función breve de una sola expresión. map aplica una función a cada elemento y devuelve un iterador: entrega resultados a medida que se consumen, como un dispensador. list consume ese iterador para reunir sus valores. Si ya lo consumiste, no vuelve al inicio por sí solo.',
'numeros = [1, 2, 3] # Define los mismos datos para las tres formas.\ndobles = [] # Prepara una lista vacía.\nfor n in numeros: # Recorre cada número.\n    dobles.append(n * 2) # Agrega el doble a la lista.\nprint(dobles) # Muestra el resultado del bucle.\ndobles = [n * 2 for n in numeros] # Construye los dobles con una comprensión.\nprint(dobles) # Muestra el mismo resultado.\ndobles = list(map(lambda n: n * 2, numeros)) # Aplica una lambda y consume el iterador.\nprint(dobles) # Muestra los dobles reunidos en una lista.', '[2, 4, 6]\n[2, 4, 6]\n[2, 4, 6]', 'Obtené [11, 12, 13] de [1, 2, 3] con las tres formas. Después filtrá los originales mayores que 1.', ['La transformación es sumar 10.','El filtro va al final de la comprensión.'], 'numeros = [1, 2, 3]\nresultado = []\nfor n in numeros:\n    resultado.append(n + 10)\nprint(resultado)\nprint([n + 10 for n in numeros])\nprint(list(map(lambda n: n + 10, numeros)))\nprint([n for n in numeros if n > 1]) # [2, 3]', ['Las tres formas producen [11, 12, 13].','Consume map con list.','El filtro conserva [2, 3].'], 'map no devuelve directamente una lista. No confundas el iterador con su contenido ya consumido.', 'transform', [q('Tipo de resultado de map, antes de usar list.','iterador','map entrega valores al consumirlo.'),q('Salida de [n * 2 for n in [1, 2, 3]].','[2, 4, 6]','Cada número se duplica.'),q('Salida de [n for n in [1, 2, 3] if n > 1].','[2, 3]','El filtro excluye 1.')]);
lesson('Archivos: guardar para después','Distinguir leer, reemplazar y agregar contenido.',
'Una ruta indica dónde está un archivo. Un archivo conserva datos después de una ejecución. open abre una ruta; r lee, w escribe reemplazando y a agrega al final. with cierra el archivo al terminar el bloque. encoding="utf-8" indica cómo representar caracteres, incluidos acentos. read() lee el texto; write() lo escribe. CSV organiza filas y columnas separadas por comas; JSON representa estructuras con claves y valores; un archivo de texto guarda caracteres. try intenta un bloque y except FileNotFoundError permite responder si el archivo solicitado no existe. Por ejemplo: try seguido de una lectura, y except FileNotFoundError seguido de print("No existe"). Ambos bloques llevan indentación.',
'with open("nota.txt", "w", encoding="utf-8") as archivo: # Abre para reemplazar y asegura el cierre.\n    archivo.write("Repasar listas") # Escribe texto sin agregar salto de línea.\nwith open("nota.txt", "r", encoding="utf-8") as archivo: # Abre el archivo para leer.\n    print(archivo.read()) # Lee todo y lo muestra.', 'Repasar listas', 'Escribí código que agregue " y tuplas" a nota.txt y luego lea el contenido.', ['El modo a conserva lo anterior.','Usá otro bloque with con modo r para leer.'], 'with open("nota.txt", "a", encoding="utf-8") as archivo:\n    archivo.write(" y tuplas")\nwith open("nota.txt", "r", encoding="utf-8") as archivo:\n    print(archivo.read()) # Repasar listas y tuplas', ['Usa a para agregar.','Lee con r y cierra con with.','Conserva el texto anterior.'], 'El modo w borra el contenido previo al abrir el archivo. Elegilo solo si querés reemplazarlo.', 'file', [q('Modo para agregar al final.','a','w reemplaza; a conserva y agrega.'),q('Error de leer una ruta inexistente.','FileNotFoundError','No existe el archivo solicitado.'),q('Codificación usada para acentos en el ejemplo.','utf-8','La misma codificación se usa al escribir y al leer.')]);
lesson('Librerías y math','Elegir una herramienta e importarla.',
'Una librería reúne herramientas reutilizables. Un módulo es una unidad de código importable; un paquete organiza módulos. import permite usar lo instalado; no instala nada. Un alias da un nombre corto, como import math as m. La biblioteca estándar viene con Python e incluye math. NumPy y pandas son paquetes externos. Un entorno virtual aísla paquetes de un proyecto; si trabajás localmente, seguí las instrucciones oficiales. Esta página no necesita instalar Python. sqrt calcula raíz cuadrada; floor redondea hacia abajo; ceil hacia arriba; pi aproxima π.',
'import math # Importa el módulo estándar de matemática.\nprint(math.sqrt(81)) # Calcula la raíz cuadrada de 81.\nprint(math.floor(3.8)) # Toma el entero inferior.\nprint(math.ceil(3.2)) # Toma el entero superior.', '9.0\n3\n4', 'Calculá el área de un círculo de radio 2 usando math.pi. Explicá por qué importar no equivale a instalar.', ['Área = π por radio al cuadrado.','Usá math.pi * 2 ** 2.'], 'import math\nprint(math.pi * 2 ** 2) # 12.566370614359172\n# Importar habilita un módulo disponible; instalar agrega un paquete al entorno.', ['Usa pi y radio al cuadrado.','Obtiene aproximadamente 12.57 unidades cuadradas.','Distingue importar de instalar.'], 'math.sqrt(-1) no produce una raíz real: genera ValueError. Para esta práctica usá valores no negativos.', 'math', [q('Resultado de math.floor(3.8).','3','Es el entero inferior.'),q('Resultado de math.ceil(3.2).','4','Es el entero superior.'),q('¿math es estándar o externo?','estándar','Se distribuye con Python.')]);
lesson('NumPy: listas frente a arrays','Predecir operaciones distintas sobre los mismos números.',
'NumPy es una librería externa para cálculo numérico. Un array organiza elementos de un tipo compatible. import numpy as np usa el alias habitual. np.array crea un array. shape describe su forma: (3,) significa tres elementos en una dimensión. ndim cuenta dimensiones; dtype indica el tipo almacenado y puede variar según plataforma. a[0] selecciona la primera posición. Las operaciones numéricas se aplican elemento a elemento, sin escribir un bucle explícito.',
'import numpy as np # Importa NumPy con un alias corto.\na = np.array([10, 20, 30]) # Crea un array numérico unidimensional.\nprint(a * 2) # Multiplica cada valor por dos.\nprint([10, 20, 30] * 2) # Repite la lista completa dos veces.', '[20 40 60]\n[10, 20, 30, 10, 20, 30]', 'Sumá 5 a cada tiempo con NumPy. Escribí shape y ndim esperados.', ['Un array admite sumar un número a todos sus elementos.','La forma sigue siendo (3,) y tiene una dimensión.'], 'import numpy as np\na = np.array([10, 20, 30])\nprint(a + 5) # [15 25 35]\nprint(a.shape) # (3,)\nprint(a.ndim) # 1', ['Obtiene [15 25 35].','Reconoce shape (3,).','Reconoce ndim 1.'], 'lista * 2 repite elementos; array * 2 multiplica valores. lista + 5 produce TypeError.', 'array', [q('Cantidad de elementos de [10, 20, 30] * 2.','6','La lista se repite completa dos veces.'),q('Primer valor de np.array([10, 20, 30]) * 2.','20','El array multiplica 10 por 2.'),q('ndim de np.array([10, 20, 30]).','1','Tiene un solo eje.')]);
lesson('Matrices, ejes y filtros','Calcular agregaciones y señalar qué celdas participan.',
'Una matriz es una tabla de números. En m[fila, columna], ambas posiciones empiezan en cero. m[0, :] selecciona toda la primera fila; m[:, 1] toda la segunda columna. reshape cambia la forma conservando la cantidad de elementos: np.array([10,20,30,40]).reshape(2,2). Una máscara booleana es una tabla de True y False; m > 20 permite elegir valores. sum suma, mean promedia, min encuentra el menor y max el mayor. En estos ejemplos, axis=0 recorre filas y deja un resultado por columna; axis=1 recorre columnas y deja un resultado por fila.',
'import numpy as np # Importa las herramientas numéricas.\nm = np.array([[10, 20], [30, 40]]) # Crea dos filas y dos columnas.\nprint(m.shape) # Muestra la forma de la matriz.\nprint(m.mean()) # Promedia los cuatro números.\nprint(m.sum(axis=0)) # Suma por columnas: 10+30 y 20+40.\nprint(m.sum(axis=1)) # Suma por filas: 10+20 y 30+40.\nprint(m[m > 20]) # Conserva solo valores mayores que 20.', '(2, 2)\n25.0\n[40 60]\n[30 70]\n[30 40]', 'Calculá el promedio por columna y el máximo por fila. Señalá los pares usados.', ['Para columnas usá axis=0.','Promedios: (10+30)/2 y (20+40)/2.'], 'print(m.mean(axis=0)) # [20. 30.]\nprint(m.max(axis=1)) # [20 40]\n# Columnas: (10,30), (20,40). Filas: (10,20), (30,40).', ['Promedios 20 y 30 con axis=0.','Máximos 20 y 40 con axis=1.','Identifica las celdas de cada grupo.'], 'axis no es el número de la columna elegida. Indica el eje que se reduce al agregar.', 'matrix', [q('Suma de la primera columna.','40','10 + 30 = 40.'),q('Eje para obtener un total por fila.','1','axis=1 reduce las columnas de cada fila.'),q('Promedio de los cuatro valores.','25','100 / 4 = 25.')]);
lesson('Pandas: consultar tablas','Distinguir columnas, etiquetas y posiciones.',
'Pandas trabaja con tablas llamadas DataFrames. Una Series es una secuencia de valores con etiquetas, como una columna. pd.DataFrame construye una tabla a partir de datos; pd.read_csv("tickets.csv") lee un archivo CSV. head() muestra las primeras cinco filas; shape devuelve filas y columnas; info() describe tipos y cantidades no faltantes. df["minutos"] selecciona una columna. loc selecciona por etiquetas; iloc por posiciones. df.loc[0, "minutos"] busca etiqueta 0; df.iloc[0, 1] busca primera fila, segunda columna. Coinciden aquí porque el índice es el predeterminado, pero no siempre.',
'import pandas as pd # Importa pandas con su alias habitual.\ndf = pd.DataFrame({"categoria": ["correo", "red", "correo"], "minutos": [10, 30, 20]}) # Crea tres filas alineando posiciones.\nprint(df["minutos"].mean()) # Selecciona la columna y calcula su promedio.', '20.0', 'Escribí el filtro para mostrar solo filas con más de 15 minutos. Explicá loc frente a iloc.', ['La comparación produce una máscara de filas.','Usá df[df["minutos"] > 15].'], 'print(df[df["minutos"] > 15])\n# Conserva red:30 y correo:20. loc usa etiquetas; iloc posiciones.', ['Filtra con > 15.','Conserva dos filas.','Distingue etiquetas de posiciones.'], 'Si cambiás las etiquetas del índice, loc[0] puede no existir aunque sí exista iloc[0].', 'frame', [q('Cantidad de filas del ejemplo.','3','Cada lista aporta tres valores alineados.'),q('Selector que usa posiciones: loc o iloc.','iloc','loc trabaja con etiquetas.'),q('Promedio de los minutos del ejemplo.','20','(10 + 30 + 20) / 3 = 20.')]);
lesson('Limpiar y resumir con pandas','Explicar qué filas entran en cada resumen.',
'Limpiar es revisar faltantes, duplicados y formatos. isna() detecta faltantes. dropna(subset=["minutos"]) elimina filas sin ese dato. fillna(0) reemplaza faltantes por cero, pero solo tiene sentido con una justificación real. duplicated() detecta filas repetidas; drop_duplicates() conserva una por combinación repetida. sort_values ordena por valores; value_counts cuenta frecuencias. groupby reúne filas por una clave y una agregación, como mean, resume cada grupo. mean omite faltantes por defecto. Siempre informá cuántos valores conocidos entraron al cálculo.',
'import pandas as pd # Importa las herramientas para tablas.\ndf = pd.DataFrame({"categoria": ["correo", "red", "correo", "impresora", "red", "impresora"], "minutos": [10, 30, 20, None, 40, 20]}) # None representa un tiempo desconocido.\nprint(df["minutos"].isna().sum()) # Cuenta las posiciones faltantes.\nprint(df["minutos"].mean()) # Promedia solamente los cinco valores conocidos.\nprint(df.groupby("categoria")["minutos"].mean().to_dict()) # Agrupa, promedia y convierte el resumen a diccionario.', "1\n24.0\n{'correo': 15.0, 'impresora': 20.0, 'red': 35.0}", 'Contá faltantes, excluilos para el análisis de tiempos y ordená los promedios por categoría de mayor a menor. Registrá cuántas filas excluiste.', ['dropna con subset se concentra en minutos.','Agrupá y luego usá sort_values(ascending=False).'], 'limpios = df.dropna(subset=["minutos"])\nprint(len(df) - len(limpios)) # 1\nprint(limpios.groupby("categoria")["minutos"].mean().sort_values(ascending=False))\n# red 35, impresora 20, correo 15; impresora tiene un solo tiempo conocido.', ['Registra una fila excluida.','Ordena 35, 20, 15.','Aclara que falta un tiempo de impresora.'], 'Rellenar el faltante con 0 cambia el promedio general de 24 a 20. Ese cero sería un dato inventado.', 'clean', [q('Cantidad de tiempos conocidos.','5','Hay seis filas y un faltante.'),q('Promedio conocido general.','24','120 minutos repartidos entre cinco registros.'),q('Promedio conocido de impresora.','20','Solo un ticket de impresora tiene tiempo conocido.')]);
lesson('Matplotlib: comunicar con gráficos','Elegir un gráfico y etiquetarlo con unidades.',
'Un gráfico representa datos, no reemplaza su explicación. Barras comparan categorías; líneas muestran una evolución ordenada, por ejemplo días; un histograma agrupa valores numéricos en intervalos para ver su distribución. Matplotlib es una librería de gráficos. fig es la figura completa y ax el área con ejes. plt.subplots() crea ambas. ax.bar dibuja barras; ax.plot líneas; ax.hist un histograma. Un título explica la pregunta; las etiquetas y unidades indican qué se mide. plt.show() muestra la figura.',
'import matplotlib.pyplot as plt # Importa las herramientas gráficas.\nfig, ax = plt.subplots() # Crea una figura y un área de ejes.\nax.bar(["Correo", "Red"], [15, 35]) # Asocia cada categoría con su promedio.\nax.set_title("Tiempo medio por categoría") # Explica qué se compara.\nax.set_ylabel("Minutos") # Indica la unidad del eje vertical.\nplt.show() # Solicita mostrar la figura.', 'Sin salida de texto. Figura con dos barras: Correo 15 minutos y Red 35 minutos.', 'Elegí gráficos para comparar categorías y para cantidad de tickets durante tres días. Escribí título y unidades.', ['Las categorías no tienen una continuidad temporal.','Los días sí tienen un orden temporal.'], 'Categorías: barras; título «Tiempo medio por categoría», eje y «Minutos». Días: líneas; título «Tickets por día», eje x «Día», eje y «Cantidad de tickets».', ['Usa barras para categorías.','Usa líneas para evolución.','Incluye título y unidades.'], 'Un eje sin unidad impide saber si 35 representa minutos, pesos o tickets.', 'chart', [q('Gráfico para distribución de tiempos en intervalos.','histograma','Agrupa números en intervalos y cuenta frecuencias.'),q('Gráfico para comparar categorías.','barras','Cada categoría tiene una barra independiente.'),q('Unidad del ejemplo.','minutos','La altura representa tiempo medio.')]);
lesson('SciPy y herramientas científicas','Relacionar un problema con una librería apropiada.',
'SciPy agrega herramientas científicas apoyadas en NumPy. Estadística resume y estudia datos; optimización busca una solución que minimiza o maximiza una cantidad; integración calcula acumulaciones, como áreas. Aquí solo reconoceremos estos usos. from scipy import stats importa el módulo de estadística. stats.describe resume valores. El resultado guarda campos: nobs cuenta observaciones y mean contiene el promedio. No necesitás fórmulas avanzadas para interpretar esos dos campos.',
'from scipy import stats # Importa el módulo de estadística de SciPy.\nresultado = stats.describe([10, 20, 30]) # Calcula un resumen de tres observaciones.\nprint(resultado.nobs) # Consulta la cantidad de observaciones.\nprint(resultado.mean) # Consulta el promedio calculado.', '3\n20.0', 'Elegí una herramienta para raíz cuadrada, duplicar un array y resumir observaciones. Justificá cada elección.', ['math viene con Python.','NumPy opera sobre arrays; SciPy tiene herramientas estadísticas.'], 'math.sqrt para la raíz; NumPy para multiplicar un array; scipy.stats.describe para un resumen estadístico. Son herramientas adecuadas, aunque algunas tareas admiten otras soluciones.', ['Asocia math con raíz.','Asocia NumPy con arrays.','Asocia SciPy con estadística.'], 'Importar SciPy requiere que esté instalado en el entorno del kernel que usás. Instalar en otro entorno no lo hace disponible aquí.', 'tools', [q('nobs de [10, 20, 30].','3','Hay tres observaciones.'),q('mean de [10, 20, 30].','20','La suma es 60 y la cantidad es 3.'),q('Librería sobre la que se apoya SciPy.','NumPy','Sus herramientas científicas trabajan con arrays de NumPy.')]);
lesson('Aprender patrones: entrenamiento y prueba','Separar datos para aprender y para evaluar.',
'Aprendizaje automático significa ajustar patrones con ejemplos para predecir otros casos. X contiene características de entrada; y es el objetivo. Regresión predice números, como minutos; clasificación predice clases, como una categoría. fit ajusta el modelo con entrenamiento; predict calcula predicciones. Una métrica resume errores: MAE es el promedio del error absoluto, en la misma unidad del objetivo. Sobreajuste significa aprender detalles del entrenamiento que no se sostienen en casos nuevos. train_test_split separa datos antes de ajustar modelos o transformaciones; random_state fija el azar para repetir la partición. Ajustar una transformación con datos de prueba filtra información. Los seis casos siguientes solo ilustran el procedimiento: no demuestran calidad predictiva.',
'from sklearn.model_selection import train_test_split # Importa la herramienta de separación.\nX = [[1], [2], [3], [4], [5], [6]] # Crea una característica ficticia por observación.\ny = [10, 20, 30, 40, 50, 60] # Define minutos como objetivo numérico.\nX_ent, X_pru, y_ent, y_pru = train_test_split(X, y, test_size=2, random_state=0) # Reserva dos casos y mantiene alineadas entradas y objetivos.\nprint(len(X_ent), len(X_pru)) # Muestra cantidades; no evalúa ningún modelo.', '4 2', 'Diseñá una predicción de minutos. Nombrá dos características disponibles antes de atender el ticket, el objetivo y una forma de evitar filtración.', ['No uses la duración final como entrada para predecir esa misma duración.','Separá antes de ajustar; reservá prueba para evaluación.'], 'X: cantidad de pasos previstos y prioridad numérica conocida al inicio. y: minutos finales. Es regresión. Divido entrenamiento y prueba antes de ajustar transformaciones; ajusto con entrenamiento y evalúo en prueba. Seis casos no permiten concluir confiabilidad.', ['Distingue entradas previas y objetivo.','Identifica regresión.','Explica separación y limitación.'], 'Evaluar con los mismos datos usados en fit puede dar una impresión optimista. Prueba debe mantenerse separada.', 'training', [q('Predecir minutos es clasificación o regresión.','regresión','El objetivo es numérico.'),q('Método que ajusta un modelo.','fit','predict usa el modelo ya ajustado.'),q('¿Cuántos casos de prueba reserva el ejemplo?','2','test_size=2 reserva dos observaciones.')]);
lesson('Proyecto: seis tickets ficticios','Construir un resumen correcto y explicar sus límites.',
'Integramos carga, limpieza, resumen y comunicación. Los datos de abajo son inventados. id es un identificador, no una medida para promediar; categoria y estado son categóricos; minutos es numérico y admite un faltante. Cargamos una lista de diccionarios con pd.DataFrame. Para un CSV real usarías pd.read_csv. El análisis de cantidades incluye las seis filas; el análisis de tiempos usa cinco valores conocidos. No hay evidencia suficiente para generalizar sobre una organización ni evaluar un predictor.',
'import pandas as pd # Importa pandas para construir y resumir la tabla.\ndf = pd.DataFrame({"id": [1,2,3,4,5,6], "categoria": ["correo","red","correo","impresora","red","impresora"], "minutos": [10,30,20,None,40,20], "estado": ["Cerrado","Cerrado","Cerrado","Pendiente","Cerrado","Cerrado"]}) # Conserva las seis filas, incluido el faltante.\nprint(len(df)) # Cuenta todos los tickets.\nprint(df["estado"].value_counts().to_dict()) # Cuenta cada estado y lo presenta como diccionario.\nprint(df["categoria"].value_counts().to_dict()) # Cuenta tickets por categoría.\nprint(df["minutos"].isna().sum()) # Cuenta tiempos faltantes.\nprint(df["minutos"].mean()) # Promedia los cinco tiempos conocidos.\nprint(df.groupby("categoria")["minutos"].mean().to_dict()) # Calcula un promedio conocido por categoría.', "6\n{'Cerrado': 5, 'Pendiente': 1}\n{'correo': 2, 'red': 2, 'impresora': 2}\n1\n24.0\n{'correo': 15.0, 'impresora': 20.0, 'red': 35.0}", 'Cargá los seis tickets, contá por estado y categoría, identificá el faltante, calculá los promedios, dibujá barras y escribí dos conclusiones y una limitación.', ['Separá cantidad de tickets y cantidad de tiempos conocidos.','El total de tiempos es 120; dividilo por 5. Agrupá por categoría para las barras.'], 'resumen = df.groupby("categoria")["minutos"].mean()\nimport matplotlib.pyplot as plt\nfig, ax = plt.subplots()\nax.bar(resumen.index, resumen.values)\nax.set_title("Tiempos conocidos por categoría")\nax.set_ylabel("Minutos")\nplt.show()\n# 6 tickets; 5 cerrados; 1 pendiente; 1 faltante (id 4).\n# 2 por categoría; promedio 24. Correo 15, red 35, impresora 20.\n# Conclusión 1: red tiene el mayor promedio observado (35).\n# Conclusión 2: las tres categorías tienen dos tickets.\n# Limitación: impresora tiene un solo tiempo conocido; seis casos no permiten generalizar.', ['Conserva el faltante y obtiene todos los conteos correctos.','Obtiene 24, 15, 35 y 20; gráfico con unidades.','Escribe dos conclusiones acotadas y una limitación.'], 'Dos tickets de impresora no significan dos tiempos conocidos. Su promedio se apoya en un solo valor.', 'project', [q('Promedio general de tiempos conocidos.','24','(10 + 30 + 20 + 40 + 20) / 5 = 24.'),q('Cantidad de tickets cerrados.','5','Solo id 4 está pendiente.'),q('Cantidad de tiempos conocidos de impresora.','1','id 4 no tiene tiempo; id 6 tiene 20 minutos.')]);

function bounded(id,min,max){const v=Number($(id).value);return Math.max(min,Math.min(max,Number.isFinite(v)?v:min));}
function mountTraining(root){const pts=[[1,2,1],[2,3,2],[3,1,2],[4,4,3],[5,2,1],[6,3,3]];root.innerHTML='<p>Coordenadas ficticias: X = pasos previstos (cantidad), Y = recursos requeridos (cantidad), Z = prioridad (nivel 1–3). No representan el objetivo ni una métrica de calidad.</p><label for="split">Reserva para prueba (separación didáctica secuencial)</label><select id="split"><option value="2">Últimos 2 casos</option><option value="3">Últimos 3 casos</option></select><div id="trainingOut"></div><p>La proyección 2D usa X e Y; cada etiqueta incluye Z. Círculos T = entrenamiento; cuadrados P = prueba. La tabla contiene las tres coordenadas.</p><details><summary>Escena 3D opcional · requiere internet y WebGL</summary><p>Three.js <a href="https://app.unpkg.com/three%400.160.0/files/package.json" target="_blank" rel="noopener">0.160.0 (versi?n y m?dulo verificados en su manifiesto)</a> se carga desde CDN solo al pulsar. No está embebido ni disponible sin conexión. La vista 2D y la tabla permanecen disponibles.</p><button id="load3d">Cargar escena 3D</button><label for="view3d">Vista</label><select id="view3d"><option value="front">Perspectiva</option><option value="top">Desde arriba</option><option value="side">Lateral</option></select><p id="threeStatus" role="status">Sin cargar. X: pasos · Y: recursos · Z: prioridad.</p><div id="scene"></div></details>';let renderer=null,scene=null,camera=null,THREE=null,alive=true,loading=false;
const draw=()=>{const count=+$('split').value;const rows=pts.map((p,i)=>[i+1,...p,i<6-count?'T · entrenamiento':'P · prueba']);$('trainingOut').innerHTML='<svg viewBox="0 0 540 290" role="img" aria-label="Proyección de pasos y recursos; etiquetas T o P y prioridad Z"><line x1="45" y1="235" x2="500" y2="235" stroke="#203936"/><line x1="45" y1="235" x2="45" y2="25" stroke="#203936"/><text x="180" y="280">X: pasos previstos (cantidad)</text><text x="50" y="18">Y: recursos (cantidad)</text>'+[0,1,2,3,4,5,6].map(n=>'<text x="'+(45+n*65)+'" y="255">'+n+'</text>').join('')+[1,2,3,4].map(n=>'<text x="24" y="'+(240-n*45)+'">'+n+'</text>').join('')+pts.map((p,i)=>{const x=45+p[0]*65,y=235-p[1]*45,tr=i<6-count;return(tr?'<circle cx="'+x+'" cy="'+y+'" r="7" fill="#19554a"/>':'<rect x="'+(x-7)+'" y="'+(y-7)+'" width="14" height="14" fill="#9a4d1b"/>')+'<text x="'+(x-20)+'" y="'+(y-14)+'">'+(i+1)+(tr?' T':' P')+' · z='+p[2]+'</text>';}).join('')+'</svg>'+table(['Caso','X pasos','Y recursos','Z prioridad','Uso'],rows)+'<p>'+ (6-count)+' casos para ajustar; '+count+' reservados para evaluar. No se entrenó un modelo ni se calculó una métrica. Esta selección secuencial ilustra la separación, no reproduce el muestreo aleatorio del código de la sesión.</p>';if(renderer)draw3d();};
function disposeScene(){if(scene)scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});}
function draw3d(){disposeScene();scene=new THREE.Scene();scene.background=new THREE.Color(0xf7faf7);const axes=new THREE.AxesHelper(6);scene.add(axes);const label=(text,x,y,z)=>{const c=document.createElement('canvas');c.width=256;c.height=64;const cx=c.getContext('2d');cx.fillStyle='#203936';cx.font='26px sans-serif';cx.fillText(text,5,40);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sprite.position.set(x,y,z);sprite.scale.set(2.6,.65,1);scene.add(sprite);};label('X: pasos',7,0,0);label('Y: recursos',0,6.5,0);label('Z: prioridad',0,0,6.5);pts.forEach((p,i)=>{const train=i<6-+$('split').value;const mesh=new THREE.Mesh(train?new THREE.SphereGeometry(.13,12,8):new THREE.BoxGeometry(.25,.25,.25),new THREE.MeshBasicMaterial({color:train?0x19554a:0x9a4d1b}));mesh.position.set(...p);scene.add(mesh);label((i+1)+(train?' T':' P'),p[0],p[1]+.4,p[2]);});camera=new THREE.PerspectiveCamera(48,520/330,.1,100);const v=$('view3d').value;camera.position.set(...(v==='top'?[3,14,4]:v==='side'?[16,4,3]:[11,10,13]));camera.lookAt(3,2,2);renderer.render(scene,camera);}
$('split').onchange=draw;$('view3d').onchange=()=>{if(renderer)draw3d();};$('load3d').onclick=async()=>{if(loading||renderer)return;loading=true;$('load3d').disabled=true;$('threeStatus').textContent='Chargement de la scène… La vue 2D reste disponible.'.replace('Chargement de la scène… La vue 2D reste disponible.','Cargando escena… La vista 2D sigue disponible.');let timeout;try{const c=document.createElement('canvas');if(!c.getContext('webgl2')&&!c.getContext('webgl'))throw Error('WebGL no disponible');THREE=await Promise.race([import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'),new Promise((_,reject)=>{timeout=setTimeout(()=>reject(Error('Tiempo de espera agotado')),10000);})]);if(!alive)return;renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(520,330);$('scene').appendChild(renderer.domElement);renderer.domElement.setAttribute('aria-label','Escena 3D; datos equivalentes en la tabla anterior');draw3d();$('threeStatus').textContent='Vista 3D lista. Esferas T: entrenamiento; cubos P: prueba. Ejes rotulados X, Y y Z. Sin animación continua.';}catch(e){if(alive){$('threeStatus').textContent='No se pudo cargar la escena 3D. Usá la proyección 2D y la tabla equivalente. Motivo: '+e.message;$('load3d').disabled=false;}}finally{clearTimeout(timeout);loading=false;}};cleanup=()=>{alive=false;disposeScene();if(renderer)renderer.dispose();};draw();}
/* EVALUACIÓN: dos variantes de 20 ítems, con rúbrica explícita para los abiertos. */
function examData(variant){const B=variant==='B';const concepts=B?[
['¿Por qué un faltante no equivale a cero?','Debe distinguir desconocido de valor medido y explicar que rellenar con cero cambia el resumen.','Un faltante es desconocido. Cero es una medición concreta; inventarlo puede bajar el promedio.'],
['Explicá qué devuelve map y cómo obtener una lista.','Debe nombrar iterador y list(map(...)).','map devuelve un iterador; list consume sus resultados.'],
['Explicá para qué sirve el kernel de Jupyter.','Debe mencionar ejecución y conservación de variables; reiniciar borra ese estado.','Es el proceso que ejecuta código y conserva variables. Al reiniciar, se pierden los valores de la ejecución.'],
['Distinguí clasificación de regresión con dos ejemplos.','Un ejemplo de clase y otro de número, correctamente identificados.','Clasificación: categoría del ticket. Regresión: minutos de atención.'],
['¿Cuándo usarías un histograma y cuándo líneas?','Debe asociar histograma a distribución e intervalos y líneas a evolución ordenada.','Histograma: distribución de minutos en intervalos. Líneas: tickets por día.']]:[
['Distinguí Python de Jupyter.','Debe identificar lenguaje y herramienta de cuadernos, respectivamente.','Python es el lenguaje; Jupyter permite trabajar con celdas de código, texto y resultados.'],
['Distinguí print de return.','Debe explicar mostrar frente a devolver y mencionar que print devuelve None.','print muestra y devuelve None. return entrega un valor al código que llama la función.'],
['Elegí entre lista y set para conservar tickets repetidos y ordenados.','Debe elegir lista y explicar orden y duplicados.','Lista: mantiene posiciones y duplicados. Un set elimina duplicados y no garantiza orden.'],
['Explicá por qué separar entrenamiento y prueba.','Debe explicar ajuste y evaluación en casos no usados para ajustar, evitando optimismo.','Entrenamiento ajusta el patrón; prueba estima su desempeño en casos reservados. Evaluar sobre entrenamiento puede ser optimista.'],
['¿Una asociación demuestra causa? Explicá.','Debe negar la implicación y mencionar otra explicación posible.','No. Una tercera variable o el azar puede explicar la asociación.']];
const predictions=B?[
['print("correo"[1:4])','orr','El final 4 se excluye.'],['print(9 // 2)','4','División entera hacia abajo.'],['print(sum([5, 10, 15]))','30','Suma los tres valores.'],['print(len({1, 1, 2}))','2','El set elimina el duplicado.'],['print([n + 10 for n in [1, 2, 3]])','[11, 12, 13]','Suma 10 a cada valor.'],['import numpy as np\nprint(np.array([[10,20],[30,40]]).sum(axis=1))','[30 70]','Suma por filas.'],['print(120 / 5)','24.0','La división / produce un decimal.']]:[
['print(3 * 12000)','36000','Multiplica cantidad por precio.'],['print("correo"[0:3])','cor','Lee 0, 1 y 2.'],['print([1, 2] * 2)','[1, 2, 1, 2]','La lista se repite.'],['print(7 % 2)','1','Resto de dividir 7 por 2.'],['total = 0\nfor n in [10, 20, 30]:\n    total = total + n\nprint(total)','60','El acumulador suma los tres valores.'],['print(list(map(lambda n: n * 2, [1, 2, 3])))','[2, 4, 6]','map transforma; list consume.'],['import numpy as np\nprint(np.array([[10,20],[30,40]]).sum(axis=0))','[40 60]','Suma por columnas.']];
const fixes=B?[
['Corregí: datos = [10, 20]; print(datos[2]) para mostrar el segundo.','Debe usar índice 1 y explicar índice desde cero.','datos = [10, 20]\nprint(datos[1]) # 20'],['Corregí: nota = input("Nota: "); print(nota + 1), suponiendo entrada entera válida.','Debe convertir con int antes de sumar y explicar que input devuelve texto.','nota = int(input("Nota: "))\nprint(nota + 1)'],['Corregí una lectura de ruta inexistente para mostrar un aviso con try/except.','Debe usar except FileNotFoundError y bloques indentados.','try:\n    with open("inexistente.txt", "r", encoding="utf-8") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("No existe")'],['Corregí: ajustar transformaciones con todo el dataset antes de separar prueba.','Debe separar primero y ajustar transformaciones solo con entrenamiento.','Separar entrenamiento/prueba; ajustar transformación en entrenamiento y aplicarla a ambos sin reajustar con prueba.']]:[
['Corregí: if nota = 70: print("Umbral") para comparar igualdad.','Debe usar == y explicar asignación frente a comparación.','if nota == 70:\n    print("Umbral")'],['Corregí: def doble(n): print(n * 2), para guardar su resultado en x.','Debe usar return y una llamada que guarde el valor.','def doble(n):\n    return n * 2\nx = doble(3)'],['Corregí: contador = 1; while contador <= 3: print(contador), para que termine.','Debe incrementar dentro del bucle y conservar límite 3.','contador = 1\nwhile contador <= 3:\n    print(contador)\n    contador = contador + 1'],['Corregí usar open("nota.txt", "w") cuando se quiere agregar sin borrar.','Debe usar a y explicar que w reemplaza.','with open("nota.txt", "a", encoding="utf-8") as f:\n    f.write("Otra nota")']];
const tasks=B?[
['Escribí código para normalizar "  RED  " y obtener "re".','Debe usar strip, lower y slicing [0:2], obteniendo re.','texto = "  RED  ".strip().lower()\nprint(texto[0:2])'],['Escribí una función calcular_total y comprobala con 7 y 2.','Debe definir dos parámetros, devolver el producto y obtener 14.','def calcular_total(precio, cantidad):\n    return precio * cantidad\nprint(calcular_total(7, 2)) # 14'],['Con df del proyecto, contá por estado y localizá el tiempo faltante.','Debe usar value_counts e isna, obtener 5 cerrados, 1 pendiente e id 4 faltante.','print(df["estado"].value_counts())\nprint(df[df["minutos"].isna()])\n# 5 Cerrado, 1 Pendiente; falta id 4.'],['Elegí X e y para predecir minutos y explicá la limitación de seis casos.','Debe usar características previas, objetivo minutos y negar evidencia suficiente de calidad.','X: pasos previstos y prioridad inicial. y: minutos. Seis ejemplos sirven para practicar, no para afirmar calidad predictiva.']]:[
['Transformá [1, 2, 3] en [11, 12, 13] usando comprensión.','Debe sumar 10 a cada n en una comprensión válida.','resultado = [n + 10 for n in [1, 2, 3]]'],['Con df del proyecto, calculá promedio conocido y cantidad de faltantes.','Debe usar mean e isna().sum(), y obtener 24 y 1.','print(df["minutos"].mean()) # 24.0\nprint(df["minutos"].isna().sum()) # 1'],['Con df del proyecto, obtené los promedios por categoría y elegí un gráfico.','Debe agrupar y promediar, obtener 15, 35, 20 y elegir barras con minutos.','resumen = df.groupby("categoria")["minutos"].mean()\n# correo 15, red 35, impresora 20. Barras con eje en minutos.'],['Escribí dos conclusiones y una limitación sobre los seis tickets.','Dos afirmaciones correctas limitadas a la muestra y una limitación concreta.','Red tiene el mayor promedio observado (35 min). Hay dos tickets por categoría. Impresora tiene un solo tiempo conocido y no se puede generalizar.']];
return [...concepts.map(a=>({kind:'Concepto',prompt:a[0],rubric:a[1],solution:a[2]})),...predictions.map(a=>({kind:'Predicción',prompt:'Escribí exactamente la salida:\n'+a[0],answer:a[1],solution:a[2]})),...fixes.map(a=>({kind:'Corrección de error',prompt:a[0],rubric:a[1],solution:a[2]})),...tasks.map(a=>({kind:'Tarea pequeña',prompt:a[0],rubric:a[1],solution:a[2]}))];}
function renderExam(v){const data=examData(v);state.exams[v]??={};$('main').innerHTML='<span class="eyebrow">Práctica propia · Variante '+v+'</span><h1>Una pausa para comprobar</h1><p class="lead">20 ítems · 20 puntos · Sin límite de tiempo</p><div class="note">5 conceptos, 7 predicciones, 4 correcciones y 4 tareas. Un punto por ítem. Las 7 predicciones se comparan como respuestas breves; los otros 13 puntos son autoevaluación. En este simulacro las respuestas abiertas conservan la rúbrica; la ejecución y corrección automática de código están en los laboratorios de las sesiones. Escribí primero y revisá después.</div><p>14/20 equivale al 70 % mencionado en el plan. La meta personal es 16/20 en ambas variantes y explicar los errores. No conocemos preguntas, duración ni distribución del examen real; esto no garantiza aprobar.</p><p id="examScore" class="feedback" aria-live="polite"></p>'+data.map((it,j)=>{const old=state.exams[v][j];return '<section class="card"><span class="eyebrow">'+(j+1)+' / 20 · '+it.kind+' · 1 punto</span><h2>'+esc(it.prompt.split('\n')[0])+'</h2>'+(it.prompt.includes('\n')?code(it.prompt.split('\n').slice(1).join('\n')):'')+(it.rubric?'<p><strong>Criterio de autoevaluación:</strong> '+esc(it.rubric)+' Un punto si cumple todo; cero si falta una parte.</p>':'<p>Criterio: salida correcta completa, sin contar espacios exteriores. Los corchetes y valores deben coincidir.</p>')+'<label for="exam'+j+'">Tu respuesta</label><textarea id="exam'+j+'" maxlength="20000">'+esc(old?.text||'')+'</textarea><button data-submit="'+j+'">Registrar y revisar</button><div id="examFeedback'+j+'"></div></section>';}).join('')+'<section class="card"><h2>Revisá tus errores</h2><div id="examReview"></div><p>Para cada ítem con cero, anotá qué regla confundiste, corregí el ejemplo y probalo con otros valores. Las notas quedan guardadas en tu respuesta.</p><button id="resetExam">Reiniciar esta variante</button></section><footer><button id="otherExam">Abrir variante '+(v==='A'?'B':'A')+'</button> <button id="toProgress">Ver progreso</button></footer>';
const feedback=j=>{const it=data[j],a=state.exams[v][j];if(!a?.submitted)return;$('examFeedback'+j).innerHTML='<div class="feedback">'+(it.answer?'<strong>'+(a.score===1?'Correcto':'Para revisar')+'</strong>. Respuesta: '+esc(it.answer)+'. '+esc(it.solution):'<strong>Solución orientativa · Autoevaluación</strong>'+code(it.solution)+'<p>No se corrigió automáticamente. Compará con la rúbrica.</p><label for="self'+j+'">Punto autoevaluado</label><select id="self'+j+'"><option value="" '+(a.score===null?'selected':'')+'>Sin evaluar</option><option value="0" '+(a.score===0?'selected':'')+'>0 · Falta algún criterio</option><option value="1" '+(a.score===1?'selected':'')+'>1 · Cumple todos los criterios</option></select>')+'</div>';if(!it.answer)$('self'+j).onchange=e=>{a.score=e.target.value===''?null:+e.target.value;save();score();};bindCopies();};
const score=()=>{const values=Object.entries(state.exams[v]);const auto=values.filter(([j,a])=>data[j].answer&&a.submitted).reduce((n,[j,a])=>n+(a.score||0),0);const self=values.filter(([j,a])=>!data[j].answer&&a.submitted).reduce((n,[j,a])=>n+(a.score||0),0);const assessed=values.filter(([j,a])=>a.submitted&&a.score!==null).length;$('examScore').textContent='Puntaje provisional: '+(auto+self)+'/20 · Automático: '+auto+'/7 · Autoevaluado: '+self+'/13 · Ítems evaluados: '+assessed+'/20.';$('examReview').innerHTML=data.map((it,j)=>{const a=state.exams[v][j];return '<p>Ítem '+(j+1)+' · '+it.kind+': '+(!a?.submitted?'sin intentar':a.score===null?'falta autoevaluación':a.score===0?'revisar la regla y reintentar':'criterio cumplido')+'.</p>';}).join('');};
data.forEach((it,j)=>{$('exam'+j).oninput=()=>{state.exams[v][j]={text:$('exam'+j).value,submitted:false,score:null};$('examFeedback'+j).innerHTML='';save();score();};feedback(j);});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>{const j=+b.dataset.submit,txt=$('exam'+j).value.trim();if(!txt){$('examFeedback'+j).textContent='Escribí un intento antes de revisar.';return;}state.exams[v][j]={text:txt,submitted:true,score:data[j].answer?(norm(txt)===norm(data[j].answer)?1:0):null};save();feedback(j);score();});$('resetExam').onclick=()=>{if(confirm('¿Borrar respuestas y puntaje de la variante '+v+'?')){state.exams[v]={};save();renderExam(v);bindCopies();}};$('otherExam').onclick=()=>go(v==='A'?21:20);$('toProgress').onclick=()=>go(23);score();}
function renderGlossary(){const terms=[['Acumulador','Variable que conserva un resultado parcial, como una suma.'],['Agregación','Resumen de varios valores: suma, media, mínimo o máximo.'],['Argumento / parámetro','Valor enviado a una función / nombre que lo recibe.'],['Array','Estructura NumPy con elementos de un tipo compatible y una forma.'],['Asignación','Asociar un nombre a un valor usando =.'],['Booleano','Valor de verdad: True o False.'],['Categoría','Grupo nombrado, como correo o red.'],['Celda / kernel','Bloque del cuaderno / proceso que ejecuta y mantiene su estado.'],['Comprensión','Expresión que construye una colección recorriendo elementos.'],['DataFrame / Series','Tabla con columnas / datos de una dimensión con etiquetas.'],['Diccionario','Asociación de claves con valores.'],['Eje (axis)','Dirección que se reduce en una agregación de arrays.'],['Faltante','Dato desconocido; no representa automáticamente cero.'],['Función','Bloque reutilizable que puede recibir y devolver valores.'],['Índice','Posición desde cero en una secuencia; en pandas también puede ser una etiqueta.'],['Inmutable','Que no permite cambiar sus elementos en el lugar.'],['Iterador','Objeto que entrega valores a medida que se consume.'],['Lambda','Función breve definida con una sola expresión.'],['Lista / tupla','Secuencias; la lista permite cambios y la tupla no permite reemplazar elementos.'],['Máscara','Conjunto de booleanos usado para seleccionar datos.'],['Media / mediana','Suma dividida por cantidad / valor central al ordenar; con cantidad par, media de los dos centrales.'],['Métrica','Número que resume un aspecto del error o desempeño.'],['Módulo / paquete','Unidad importable de código / organización de módulos.'],['Observación','Un caso registrado, como un ticket.'],['Regresión / clasificación','Predicción numérica / predicción de clases.'],['Set','Conjunto de valores únicos sin orden garantizado.'],['Slicing','Selección de un fragmento: inicio incluido, final excluido.'],['Sobreajuste','Ajuste a detalles del entrenamiento que no generalizan.'],['Variable','Nombre asociado a un valor; en datos, característica observada.']];const links=[['Tutorial de Python en español','https://docs.python.org/es/3/tutorial/'],['Control de flujo y funciones','https://docs.python.org/es/3/tutorial/controlflow.html'],['Estructuras de datos','https://docs.python.org/es/3/tutorial/datastructures.html'],['Entrada, salida y archivos','https://docs.python.org/es/3/tutorial/inputoutput.html'],['math','https://docs.python.org/3/library/math.html'],['Try Jupyter','https://jupyter.org/try-jupyter/lab/'],['NumPy para principiantes','https://numpy.org/doc/stable/user/absolute_beginners.html'],['Tutoriales iniciales de pandas','https://pandas.pydata.org/docs/getting_started/intro_tutorials/index.html'],['Tutoriales de Matplotlib','https://matplotlib.org/stable/tutorials/index.html'],['Guía de SciPy','https://docs.scipy.org/doc/scipy/tutorial/index.html'],['Primeros pasos de scikit-learn','https://scikit-learn.org/stable/getting_started.html'],['Manual de Three.js','https://threejs.org/manual/']];$('main').innerHTML='<span class="eyebrow">Referencia de bolsillo</span><h1>Palabras que ya tienen sentido</h1><p>Consultá cuando lo necesites. No hace falta memorizar todo antes de empezar.</p><section class="card">'+table(['Término','Significado'],terms)+'</section><section class="card"><h2>Fuentes oficiales del plan</h2><p>Los enlaces requieren internet. El contenido del curso está en index.html. La integración Python está en pyodide-runner.js; el intérprete y los paquetes se descargan al usarlos.</p><ul>'+links.map(([n,u])=>'<li><a target="_blank" rel="noopener" href="'+u+'">'+n+' ↗</a></li>').join('')+'</ul></section><section class="card"><h2>Python dentro del curso</h2><p>Publicá index.html y pyodide-runner.js en la misma carpeta mediante GitHub Pages. Subirlos al repositorio sin activar Pages no sirve el sitio web. El laboratorio usa <a href="https://pyodide.org/en/0.29.3/usage/webworker.html" target="_blank" rel="noopener">Pyodide 0.29.3 en un Web Worker</a>. La descarga inicial y los paquetes requieren internet; no se promete funcionamiento sin conexión del intérprete.</p><p>La lectura y las simulaciones siguen disponibles sin descargar Python. Ejecutar comprueba el comportamiento; revisar sintaxis solo compila; corregir aplica pruebas concretas. Las explicaciones y conclusiones siguen usando rúbrica. El botón Detener cancela el proceso; cada ejecución empieza con variables y archivos de trabajo nuevos.</p><h2>Verificación y límites</h2><p>Los ejemplos principales de Python estándar y los resultados del proyecto se verificaron con Python 3.12. La infraestructura de corrección se comprueba con Python local y la sintaxis JavaScript con Node. Las pruebas en navegador y la descarga real de Pyodide no pudieron completarse en este entorno restringido. Las librerías externas no estaban instaladas localmente. No se afirma una verificación visual ni de esas ejecuciones.</p><h2>Mapa de cobertura</h2>'+table(['Tema','Sesiones'],[['Data Science','1 y 19'],['Jupyter','2'],['Python básico','3–6'],['Cadenas y secuencias','4 y 7'],['Colecciones','7–8'],['Funciones','9'],['Lambda, map y comprensiones','10'],['Archivos','11'],['Librerías y math','12'],['NumPy','13–14'],['Pandas','15–16'],['Matplotlib','17'],['SciPy y scikit-learn','18–19'],['Proyecto y evaluación','20, simulacros A y B']])+'</section>';}

se conserva.';}e.target.value='';};$('resetAll').onclick=()=>{if(confirm('¿Borrar todas las lecturas, respuestas e intentos? Exportá antes si querés conservarlos.')){state=fresh();save();go(0);}};save();}
